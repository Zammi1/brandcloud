name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@brandcloud/ui 1.0.0"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A small repository or code snippet helps most.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, framework and Node version
